<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Map with Markers from Google Sheets</title>
    <link rel="stylesheet" href="https://unpkg.com/leaflet/dist/leaflet.css" />
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <style>
        body {
            font-family: Arial, sans-serif;
        }
        #map {
            height: 90vh; /* Adjusted to make space for the search box */
            width: 100%;
        }
        .search-container {
            margin: 10px;
            text-align: center;
        }
        .modal {
            display: none; 
            position: fixed; 
            z-index: 1000; /* Ensure modal is on top */
            left: 0;
            top: 0;
            width: 100%;
            height: 100%;
            overflow: auto;
            background-color: rgb(0,0,0);
            background-color: rgba(0,0,0,0.4); 
            padding-top: 60px;
            display: flex;
            justify-content: center;
            align-items: center;
        }
        .modal-content {
        background-color: #ffffff;
        padding: 0px;
        border: 1px solid #ddd;
        width: 90%;
        max-width: 500px;
        border-radius: 16px;
        }

        }
        .close {
            color: #aaa;
            float: right;
            font-size: 28px;
            font-weight: bold;
        }
        .close:hover,
        .close:focus {
            color: black;
            text-decoration: none;
            cursor: pointer;
        }
        .tabs {
            overflow: hidden;
            background-color: #f1f1f1;
            border-bottom: 1px solid #ccc;
        }
        .tabs button {
            background-color: inherit;
            float: left;
            border: none;
            outline: none;
            cursor: pointer;
            padding: 14px 16px;
            transition: 0.3s;
        }
        .tabs button:hover {
            background-color: #ddd;
        }
        .tabs button.active {
            background-color: #ccc;
        }
        .tabcontent {
            display: none;
            padding: 0px;
        }
    </style>
</head>
<body>

<div style="background:#0077cc;color:white;text-align:center;padding:10px;font-size:14px;font-weight:bold;">
    AquaGuard: An Innovative Real-Time Flood Detection and Alert System for Commuter Safety
</div>


<div class="tabs">
    <button class="tablink" onclick="openTab(event, 'MapTab')" id="defaultOpen">Map</button>
    <button class="tablink" onclick="openTab(event, 'SupportTab')">Consumer Support</button>
</div>

<div id="MapTab" class="tabcontent">
    <div class="search-container">
        <input type="text" id="search-box" list="search-suggestions" placeholder="Search for markers..." />
        <datalist id="search-suggestions"></datalist>
        <button onclick="refreshApp()">Refresh</button>
    </div>
    <div id="map"></div>
    <div style="padding:15px; border-top:2px solid #eee; margin-top:10px;">
  <h3>🔴 Recent Danger Alerts</h3>
  <div id="alert-log">Loading...</div>
</div>
</div>

<div id="SupportTab" class="tabcontent">
    <h2>Consumer Support</h2>
    <form id="support-form">
        <label for="name">Name:</label><br>
        <input type="text" id="name" name="name" required><br><br>
        <label for="email">Email:</label><br>
        <input type="email" id="email" name="email" required><br><br>
        <label for="message">Message:</label><br>
        <textarea id="message" name="message" rows="4" required></textarea><br><br>
        <button type="submit">Send Message</button>
    </form>
</div>

<div id="modal" class="modal" style="display:none;">
    <div class="modal-content">
        <span class="close">&times;</span>
        <div id="modal-info"></div>
    </div>
</div>

<script src="https://unpkg.com/leaflet/dist/leaflet.js"></script>
<script src="https://apis.google.com/js/api.js"></script>
<script src="app.js"></script>
<script>
    function openTab(evt, tabName) {
    var i, tabcontent, tablinks;
    tabcontent = document.getElementsByClassName("tabcontent");
    for (i = 0; i < tabcontent.length; i++) {
        tabcontent[i].style.display = "none";
    }
    tablinks = document.getElementsByClassName("tablink");
    for (i = 0; i < tablinks.length; i++) {
        tablinks[i].className = tablinks[i].className.replace(" active", "");
    }
    document.getElementById(tabName).style.display = "block";
    evt.currentTarget.className += " active";
    
    // บอก Leaflet ให้คำนวณขนาดใหม่
    if (tabName === 'MapTab') {
        setTimeout(function() { map.invalidateSize(); }, 100);
    }
}

    document.getElementById("defaultOpen").click();

    // Handle form submission
    document.getElementById('support-form').addEventListener('submit', function(event) {
        event.preventDefault();
        const name = document.getElementById('name').value;
        const email = document.getElementById('email').value;
        const message = document.getElementById('message').value;
        
        // Create mailto link
        const mailtoLink = `mailto:developer@example.com?subject=Consumer Support&body=Name: ${name}%0AEmail: ${email}%0AMessage: ${message}`;
        window.location.href = mailtoLink;
    });

    // Refresh function
    function refreshApp() {
        initClient();
    }
</script>
</body>
</html>
