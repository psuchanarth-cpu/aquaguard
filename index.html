<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AquaGuard</title>
    <link rel="stylesheet" href="https://unpkg.com/leaflet/dist/leaflet.css" />
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            font-family: Arial, sans-serif;
            background: #0a0e1a;
            color: #fff;
        }

        .header {
            background: linear-gradient(90deg, #0a0e1a, #0d47a1);
            color: white;
            text-align: center;
            padding: 16px 20px;
            font-size: 16px;
            font-weight: bold;
            letter-spacing: 0.5px;
            border-bottom: 2px solid #1565c0;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .tabs {
            overflow: hidden;
            background: #0d1117;
            border-bottom: 1px solid #1565c0;
        }
        .tabs button {
            background: transparent;
            color: #aaa;
            float: left;
            border: none;
            outline: none;
            cursor: pointer;
            padding: 12px 20px;
            font-size: 14px;
            transition: 0.3s;
        }
        .tabs button:hover { color: #fff; background: #1a2035; }
        .tabs button.active { color: #4fc3f7; border-bottom: 2px solid #4fc3f7; }

        .tabcontent { display: none; padding: 0; }

        #map { height: calc(100vh - 120px); width: 100%; }

        .search-container {
            padding: 8px 12px;
            background: #0d1117;
            border-bottom: 1px solid #1a2035;
            display: flex;
            gap: 8px;
            align-items: center;
        }
        .search-container input {
            flex: 1;
            padding: 8px 12px;
            border-radius: 8px;
            border: 1px solid #1565c0;
            background: #1a2035;
            color: #fff;
            font-size: 13px;
        }
        .search-container button {
            padding: 8px 16px;
            background: #1565c0;
            color: white;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            font-size: 13px;
        }

        .alert-section {
            padding: 12px 16px;
            background: #0d1117;
            border-top: 1px solid #1a2035;
        }
        .alert-section h3 {
            font-size: 13px;
            color: #4fc3f7;
            margin-bottom: 8px;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .modal {
            display: none;
            position: fixed;
            z-index: 1000;
            left: 0; top: 0;
            width: 100%; height: 100%;
            background: rgba(0,0,0,0.7);
            justify-content: center;
            align-items: center;
        }
        .modal-content {
            background: #0d1117;
            border: 1px solid #1565c0;
            width: 90%;
            max-width: 500px;
            border-radius: 16px;
            overflow: hidden;
            max-height: 90vh;
            overflow-y: auto;
        }
        .close {
            color: #aaa;
            float: right;
            font-size: 24px;
            font-weight: bold;
            padding: 10px 15px 0 0;
            cursor: pointer;
        }
        .close:hover { color: white; }
    </style>
</head>
<body>

<div class="header">
    <img src="https://raw.githubusercontent.com/psuchanarth-cpu/aquaguard/main/EP%20science%20competition%2022nd%20March.png"
         style="height:40px;vertical-align:middle;margin-right:12px;"
    AquaGuard: An Innovative Real-Time Flood Detection and Alert System for Commuter Safety
</div>

<div class="tabs">
    <button class="tablink" onclick="openTab(event, 'MapTab')" id="defaultOpen">🗺 Map</button>
</div>

<div id="MapTab" class="tabcontent">
    <div class="search-container">
        <input type="text" id="search-box" list="search-suggestions" placeholder="Search for locations..." />
        <datalist id="search-suggestions"></datalist>
        <button onclick="refreshApp()">Refresh</button>
    </div>
    <div id="map"></div>
    <div class="alert-section">
        <h3>🔴 Recent Danger Alerts</h3>
        <div id="alert-log">Loading...</div>
    </div>
</div>

<div id="modal" class="modal" style="display:none;">
    <div class="modal-content">
        <span class="close">&times;</span>
        <div id="modal-info"></div>
    </div>
</div>

<script src="https://unpkg.com/leaflet/dist/leaflet.js"></script>
<script src="https://apis.google.com/js/api.js"></script>
<script src="app.js"></script>
<script>
    function openTab(evt, tabName) {
        var i, tabcontent, tablinks;
        tabcontent = document.getElementsByClassName("tabcontent");
        for (i = 0; i < tabcontent.length; i++) {
            tabcontent[i].style.display = "none";
        }
        tablinks = document.getElementsByClassName("tablink");
        for (i = 0; i < tablinks.length; i++) {
            tablinks[i].className = tablinks[i].className.replace(" active", "");
        }
        document.getElementById(tabName).style.display = "block";
        evt.currentTarget.className += " active";
        if (tabName === 'MapTab') {
            setTimeout(function() { map.invalidateSize(); }, 100);
        }
    }

    document.getElementById("defaultOpen").click();

    function refreshApp() { initClient(); }
</script>
</body>
</html>
